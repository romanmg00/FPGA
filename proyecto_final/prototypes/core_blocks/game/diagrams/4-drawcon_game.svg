<svg xmlns='http://www.w3.org/2000/svg' width='1340' height='760' viewBox='0 0 1340 760'><defs><marker id='ah' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto-start-reverse'><path d='M0,0 L10,4 L0,8 z' fill='black'/></marker></defs><rect width='1340' height='760' fill='white'/>
<text x='670.0' y='22' text-anchor='middle' font-size='16' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>drawcon_game: the picture, one pixel per clk_pix</text>
<rect x='20' y='40' width='1300' height='700' fill='#eaf2fb' stroke='#999' stroke-dasharray='6 4' rx='6'/>
<text x='28' y='56' font-size='12' fill='#555' font-style='italic' font-family='Helvetica, Arial, sans-serif'>clk_pix · reads ahead of the beam, composes at curr_x / curr_y</text>
<text x='40' y='90' text-anchor='start' font-size='11' fill='black' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>curr_x, curr_y</text>
<text x='40' y='106' text-anchor='start' font-size='10' fill='#555' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>(from vga_out)</text>
<rect x='140' y='65' width='190' height='140' fill='white' stroke='black' stroke-width='1.5'/>
<text x='235.0' y='83' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>ahead(lead)</text>
<text x='235.0' y='98' text-anchor='middle' font-size='10.5' fill='#444' font-family='Helvetica, Arial, sans-serif'>raster position + lead</text>
<text x='148' y='113' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>lead 1: Arena, HUD, Wall,</text>
<text x='148' y='127' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>   Trail stripes</text>
<text x='148' y='141' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>lead 2: sprite ROMs</text>
<text x='148' y='155' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>lead 7: background</text>
<polyline points='125,95 140,95' fill='none' stroke='black' stroke-width='1.4' marker-end='url(#ah)'/>
<text x='40' y='270' text-anchor='start' font-size='11' fill='black' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>snap_* (fast_core)</text>
<rect x='140' y='240' width='190' height='90' fill='white' stroke='black' stroke-width='1.5'/>
<text x='235.0' y='258' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>per-frame latch</text>
<text x='235.0' y='273' text-anchor='middle' font-size='10.5' fill='#444' font-family='Helvetica, Arial, sans-serif'>at curr_y = 800</text>
<text x='148' y='288' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>heads, Headings, shown,</text>
<text x='148' y='302' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>Points, Lives, blink, result</text>
<polyline points='125,275 140,275' fill='none' stroke='black' stroke-width='1.4' marker-end='url(#ah)'/>
<rect x='400' y='60' width='260' height='60' fill='white' stroke='black' stroke-width='1.5'/>
<text x='530.0' y='78' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>Arena port B</text>
<text x='530.0' y='93' text-anchor='middle' font-size='10.5' fill='#444' font-family='Helvetica, Arial, sans-serif'>b_addr → b_rdata, 1 cycle</text>
<rect x='400' y='130' width='260' height='80' fill='white' stroke='black' stroke-width='1.5'/>
<text x='530.0' y='148' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>sprite_rom ×4</text>
<text x='530.0' y='163' text-anchor='middle' font-size='10.5' fill='#444' font-family='Helvetica, Arial, sans-serif'>BRAM, 2 cycles</text>
<text x='408' y='178' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>bike-synth-32 ×2 (rotated by address)</text>
<text x='408' y='192' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>reward gem / star 16 × 16</text>
<rect x='400' y='220' width='260' height='90' fill='white' stroke='black' stroke-width='1.5'/>
<text x='530.0' y='238' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>HUD</text>
<text x='530.0' y='253' text-anchor='middle' font-size='10.5' fill='#444' font-family='Helvetica, Arial, sans-serif'>registered (lead 1)</text>
<text x='408' y='268' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>7-seg digits: comparators</text>
<text x='408' y='282' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>Lives / play / crown: 64 × 16 ROM</text>
<rect x='400' y='320' width='260' height='110' fill='white' stroke='black' stroke-width='1.5'/>
<text x='530.0' y='338' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>background</text>
<text x='530.0' y='353' text-anchor='middle' font-size='10.5' fill='#444' font-family='Helvetica, Arial, sans-serif'>7 registers (lead 7)</text>
<text x='408' y='368' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>sky 64 × 12 ROM, sun 321 × 21 ROM</text>
<text x='408' y='382' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>star hash: 3 DSP48 (MREG, PREG)</text>
<text x='408' y='396' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>grid every 32 px, pulse ROM</text>
<text x='408' y='410' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>Arena-edge glow</text>
<rect x='400' y='440' width='260' height='60' fill='white' stroke='black' stroke-width='1.5'/>
<text x='530.0' y='458' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>neon Wall</text>
<text x='530.0' y='473' text-anchor='middle' font-size='10.5' fill='#444' font-family='Helvetica, Arial, sans-serif'>registered (lead 1): tube, glow</text>
<rect x='400' y='510' width='260' height='60' fill='white' stroke='black' stroke-width='1.5'/>
<text x='530.0' y='528' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>Trail stripes</text>
<text x='530.0' y='543' text-anchor='middle' font-size='10.5' fill='#444' font-family='Helvetica, Arial, sans-serif'>(x + y − 2·frame) mod 64 &lt; 6</text>
<rect x='400' y='580' width='260' height='50' fill='white' stroke='black' stroke-width='1.5'/>
<text x='530.0' y='598' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>frame counter</text>
<text x='530.0' y='613' text-anchor='middle' font-size='10.5' fill='#444' font-family='Helvetica, Arial, sans-serif'>frame[4:3] = animation phase</text>
<polyline points='330,135 365,135 365,90 400,90' fill='none' stroke='black' stroke-width='1.4' marker-end='url(#ah)'/>
<polyline points='330,135 365,135 365,170 400,170' fill='none' stroke='black' stroke-width='1.4' marker-end='url(#ah)'/>
<polyline points='330,135 365,135 365,265 400,265' fill='none' stroke='black' stroke-width='1.4' marker-end='url(#ah)'/>
<polyline points='330,135 365,135 365,375 400,375' fill='none' stroke='black' stroke-width='1.4' marker-end='url(#ah)'/>
<polyline points='330,135 365,135 365,470 400,470' fill='none' stroke='black' stroke-width='1.4' marker-end='url(#ah)'/>
<polyline points='330,135 365,135 365,540 400,540' fill='none' stroke='black' stroke-width='1.4' marker-end='url(#ah)'/>
<polyline points='330,285 380,285 380,600 400,600' fill='none' stroke='black' stroke-width='1.4' marker-end='url(#ah)'/>
<rect x='760' y='60' width='280' height='570' fill='white' stroke='black' stroke-width='1.5'/>
<text x='900.0' y='78' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica, Arial, sans-serif'>composition (always_comb)</text>
<text x='900.0' y='93' text-anchor='middle' font-size='10.5' fill='#444' font-family='Helvetica, Arial, sans-serif'>bottom → top, at the current pixel</text>
<text x='768' y='108' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>1  Cell code from Arena port B:</text>
<text x='768' y='122' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>     empty → background (sky, sun,</text>
<text x='768' y='136' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>       stars, grid, edge glow)</text>
<text x='768' y='150' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>     Wall → neon Wall colour</text>
<text x='768' y='164' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>     Trail / head → Player colour,</text>
<text x='768' y='178' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>       shine on stripes</text>
<text x='768' y='192' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>     Crash → its Player's Trail</text>
<text x='768' y='206' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>     Reward → gem / star texel,</text>
<text x='768' y='220' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>       000 transparent, 0F0 tint</text>
<text x='768' y='234' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>2  Bikes: P2 then P1 texel</text>
<text x='768' y='248' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>     (0F0 → Player colour)</text>
<text x='768' y='262' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>3  HUD band (y &lt; 64)</text>
<text x='768' y='276' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>4  10 px white border</text>
<text x='768' y='290' font-size='10.5' fill='#333' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>5  black outside 1280 × 800</text>
