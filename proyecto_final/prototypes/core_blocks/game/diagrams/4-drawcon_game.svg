<text x='1110.0' y='324.0' text-anchor='middle' font-size='11' fill='black' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>draw_r/g/b[3:0]</text>
<text x='1190' y='334' text-anchor='start' font-size='11' fill='black' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>vga_out</text>
<text x='40' y='690' text-anchor='start' font-size='10.5' fill='#555' font-style='italic' xml:space='preserve' font-family='Helvetica, Arial, sans-serif'>Only composition sits between curr_x/curr_y and the pins (vga_out is combinational): everything else is read early and registered.</text></svg>
