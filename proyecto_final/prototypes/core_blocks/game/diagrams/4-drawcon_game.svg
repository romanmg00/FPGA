<polyline points='660,170 760,170' fill='none' stroke='black' stroke-width='1.4' marker-end='url(#ah)'/>
<polyline points='660,265 760,265' fill='none' stroke='black' stroke-width='1.4' marker-end='url(#ah)'/>
<polyline points='660,375 760,375' fill='none' stroke='black' stroke-width='1.4' marker-end='url(#ah)'/>
<polyline points='660,470 760,470' fill='none' stroke='black' stroke-width='1.4' marker-end='url(#ah)'/>
<polyline points='660,540 760,540' fill='none' stroke='black' stroke-width='1.4' marker-end='url(#ah)'/>
